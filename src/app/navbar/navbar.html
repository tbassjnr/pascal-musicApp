<nav class="navbar navbar-expand-lg navbar-light bg-white py-2 px-4 shadow-sm sticky-top">
  <div class="container">
    
    <!-- Brand: Stays on top row, left -->
    <a class="navbar-brand d-flex align-items-center fw-bold fs-5" routerLink="/home">
      <img src="assets/images/logobg.png" alt="PKM logo" class="brand-logo me-2">
      <span class="brand-text">Pascal Koomson Ministries</span>
    </a>

    <!-- Toggler: Stays on top row, right -->
    <button class="navbar-toggler custom-toggler border-0 shadow-none" 
            type="button" 
            data-bs-toggle="collapse" 
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Hidden Content: Wraps below the row above because of width: 100% -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item fw-bold" *ngFor="let link of navLinks" [ngClass]="{'dropdown': link.children}">
          
          <!-- Dropdown Logic -->
          <ng-container *ngIf="link.children; else singleLink">
            <a class="nav-link dropdown-toggle px-3" href="#" role="button" data-bs-toggle="dropdown">
              {{link.label}}
            </a>
            <ul class="dropdown-menu dropdown-animated border-0 shadow-sm ">
              <li *ngFor="let child of link.children">
                <a class="dropdown-item bg-white text-decoration-none" [routerLink]="child.path" routerLinkActive="fw-bold text-success">
                  {{child.label}}
                </a>
              </li>
            </ul>
          </ng-container>

          <!-- Single Link Logic -->
          <ng-template #singleLink>
            <a class="nav-link px-3" [routerLink]="link.path" routerLinkActive="active-link">
              {{link.label}}
            </a>
          </ng-template>

        </li>
      </ul>
    </div>

  </div>
</nav>
