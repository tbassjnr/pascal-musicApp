<div class="protocol-page py-5">
  <div class="container">
    <!-- Header Section -->
    <div class="row mb-5 justify-content-center text-center">
      <div class="col-lg-8">
        <h6 class="text-gold fw-bold text-uppercase ls-2">Professional Excellence</h6>
        <h1 class="display-4 fw-bold text-dark mb-3">Protocol Team</h1>
        <p class="lead text-dark opacity-75">
          Our dedicated protocol team ensures every event is executed with precision, 
          discretion, and unparalleled attention to detail. Meet the professionals behind the scenes.
        </p>
        <div class="divider mx-auto"></div>
      </div>
    </div>

    <!-- The Slick Interactive Grid -->
    <div class="row g-4 protocol-grid">
      <div class="col-md-6 col-lg-3" *ngFor="let person of teamMembers">
        <div class="protocol-card shadow-lg overflow-hidden rounded-4">
          <!-- Person Image -->
          <div class="img-wrapper">
            <img [src]="person.imageUrl" [alt]="person.fullName" class="img-fluid">
            <div class="card-overlay"></div>
          </div>

          <!-- Personnel Info (Slides up on hover) -->
          <div class="person-details p-4 text-white">
            <div class="role-badge mb-2">{{ person.role }}</div>
            <h4 class="fw-bold mb-1">{{ person.fullName }}</h4>
            <p class="small bio-text opacity-0 mb-3">{{ person.bio }}</p>
            
            <div class="social-links d-flex gap-3">
              <a *ngIf="person.socials.linkedin" [href]="person.socials.linkedin" class="social-btn">
                <i class="bi bi-linkedin"></i>
              </a>
              <a *ngIf="person.socials.twitter" [href]="person.socials.twitter" class="social-btn">
                <i class="bi bi-twitter-x"></i>
              </a>
              <a *ngIf="person.socials.email" [href]="person.socials.email" class="social-btn">
                <i class="bi bi-envelope-fill"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
