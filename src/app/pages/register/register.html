<div class="register-container py-5 bg-light min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Back Button -->
        <button class="btn btn-link text-dark text-decoration-none mb-4" routerLink="/tour">
          <i class="bi bi-arrow-left"></i> Back to Tour
        </button>

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden" *ngIf="show">
          <div class="row g-0">
            
            <!-- Image Section -->
            <div class="col-md-5">
              <img [src]="show.ticketImage" class="img-fluid h-100 object-fit-cover" alt="Show Image">
            </div>

            <!-- Form Section -->
            <div class="col-md-7 p-4 p-lg-5">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <span class="badge bg-success px-3 py-2 rounded-pill">FREE SHOW</span>
                <small class="text-muted">{{ show.date | date:'mediumDate' }}</small>
              </div>

              <h2 class="fw-bold mb-1">{{ show.venue }}</h2>
              <p class="text-muted mb-4"><i class="bi bi-geo-alt"></i> {{ show.location }}</p>

              <hr class="my-4 opacity-50">

              <form (ngSubmit)="sendConfirmation()" *ngIf="!isSubmitted">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Purchaser's Name</label>
                  <input type="text" class="form-control form-control-lg rounded-3" 
                         [(ngModel)]="purchaserName" name="name" placeholder="Enter your full name">
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold">Seat Number / Section</label>
                  <select class="form-select form-select-lg rounded-3" [(ngModel)]="seatNumber" name="seat">
                    <option value="" disabled>Select your preferred seat</option>
                    <option value="Front Row - A1">Front Row - A1</option>
                    <option value="Middle Section - B12">Middle Section - B12</option>
                    <option value="Balcony - C5">Balcony - C5</option>
                    <option value="General Admission">General Admission</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill shadow-sm">
                  Complete Free Booking
                </button>
                <p class="text-center small text-muted mt-3">
                  Clicking "Complete" will send ticket details via Email & SMS.
                </p>
              </form>

              <!-- Success Message -->
              <div class="text-center py-4" *ngIf="isSubmitted">
                <i class="bi bi-check-circle-fill text-success display-1"></i>
                <h3 class="fw-bold mt-3">All Set!</h3>
                <p class="text-muted">Your seat <strong>{{seatNumber}}</strong> is reserved.</p>
                <button class="btn btn-outline-dark rounded-pill px-4" routerLink="/tour">Return to Tour</button>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
