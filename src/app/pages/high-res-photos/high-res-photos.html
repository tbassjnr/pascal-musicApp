<div class="gallery-wrapper min-vh-100 py-5">
  <div class="container-fluid px-lg-5">
    
    <!-- Top Nav -->
    <div class="d-flex justify-content-between align-items-start mb-5">
      <div (click)="goBack()" class="back-pill px-4 py-2 shadow-sm">
        <i class="bi bi-chevron-left me-2"></i> Gallery Archive
      </div>
      <div class="text-end">
        <h1 class="display-5 fw-bold text-dark mb-0">Visual <span class="text-success-custom">Assets</span></h1>
        <p class="text-muted small">High-Resolution Media for Press & Partners</p>
      </div>
    </div>

    <div class="row g-5">
      <!-- Sticky Sidebar -->
        <div class="col-lg-2">
        <!-- Use custom class instead of sticky-top for better z-index control -->
        <div class="cat-sidebar-sticky">
            <h6 class="fw-bold text-uppercase ls-2 mb-4 small text-muted">Filter By</h6>
            <ul class="list-unstyled cat-list">
            <li *ngFor="let cat of categories" 
                (click)="filter(cat)"
                [class.active]="activeCategory === cat">
                {{cat}}
            </li>
            </ul>
        </div>
        </div>

      <!-- Staggered Masonry Gallery -->
      <div class="col-lg-10">
        <div class="masonry-columns">
          <div *ngFor="let photo of filteredPhotos" class="masonry-item mb-4">
            <div class="photo-container shadow-premium">
              <img [src]="photo.url" class="img-fluid rounded-4">
              
              <!-- Glass Badge on top-right -->
              <div class="size-badge">{{photo.size}}</div>

              <!-- Hover Content -->
              <div class="photo-info-overlay p-4 d-flex flex-column justify-content-end">
                <h5 class="text-white fw-bold mb-1">{{photo.title}}</h5>
                <p class="text-white-50 small mb-3">{{photo.cat}}</p>
                <button (click)="download(photo)" class="btn btn-download-slick w-100">
                  <i class="bi bi-cloud-arrow-down me-2"></i> Download High-Res
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
